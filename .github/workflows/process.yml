name: Process photos

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# Only one run at a time: the pipeline assumes it is the sole writer of the catalog.
concurrency:
  group: photoflow-process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        tenant: [wilson, wilsonfamof8]
    concurrency:
      group: photoflow-${{ matrix.tenant }}
      cancel-in-progress: false
    env:
      PHOTOFLOW_S3_ENDPOINT: https://s3.us-west-004.backblazeb2.com
      PHOTOFLOW_S3_BUCKET: ${{ secrets[format('{0}_S3_BUCKET', matrix.tenant)] }}
      PHOTOFLOW_S3_ACCESS_KEY_ID: ${{ secrets[format('{0}_S3_ACCESS_KEY_ID', matrix.tenant)] }}
      PHOTOFLOW_S3_SECRET_ACCESS_KEY: ${{ secrets[format('{0}_S3_SECRET_ACCESS_KEY', matrix.tenant)] }} 
      PHOTOFLOW_MAX_FILES_PER_RUN: 1000
      PHOTOFLOW_S3_REGION: us-west-004

    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Cache CLIP model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ vars.PHOTOFLOW_CLIP_MODEL_REPO || 'Xenova/clip-vit-base-patch32' }}

      - name: Run the pipeline
        working-directory: worker
        run: uv run photoflow-worker

      # A scheduled workflow is disabled automatically after ~60 days without repo
      # activity, which would stop backups silently. This commit keeps it alive.
