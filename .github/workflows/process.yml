name: Process photos

on:
  schedule:
    # 07:00 UTC nightly. Uploads that arrive during the day are picked up here.
    - cron: '0 7 * * *'
  workflow_dispatch:

# Only one run at a time: the pipeline assumes it is the sole writer of the catalog.
concurrency:
  group: photoflow-process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write

    env:
      PHOTOFLOW_S3_ENDPOINT: ${{ secrets.PHOTOFLOW_S3_ENDPOINT }}
      PHOTOFLOW_S3_BUCKET: ${{ secrets.PHOTOFLOW_S3_BUCKET }}
      PHOTOFLOW_S3_ACCESS_KEY_ID: ${{ secrets.PHOTOFLOW_S3_ACCESS_KEY_ID }}
      PHOTOFLOW_S3_SECRET_ACCESS_KEY: ${{ secrets.PHOTOFLOW_S3_SECRET_ACCESS_KEY }}
      PHOTOFLOW_S3_REGION: ${{ vars.PHOTOFLOW_S3_REGION }}
      PHOTOFLOW_MAX_FILES_PER_RUN: ${{ vars.PHOTOFLOW_MAX_FILES_PER_RUN }}
      PHOTOFLOW_HEALTHCHECK_URL: ${{ secrets.PHOTOFLOW_HEALTHCHECK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libimage-exiftool-perl

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock

      - name: Cache CLIP model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ vars.PHOTOFLOW_CLIP_MODEL_REPO || 'Xenova/clip-vit-base-patch32' }}

      - name: Run the pipeline
        working-directory: worker
        run: uv run photoflow-worker

      # A scheduled workflow is disabled automatically after ~60 days without repo
      # activity, which would stop backups silently. This commit keeps it alive.
      - name: Record the run
        if: github.event_name == 'schedule'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-run.txt
          git config user.name "photoflow-worker"
          git config user.email "photoflow-worker@users.noreply.github.com"
          git add .github/last-run.txt
          git diff --quiet --cached || git commit -m "chore: nightly run $(cat .github/last-run.txt)"
          git push
