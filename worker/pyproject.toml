[project]
name = "photoflow-worker"
version = "0.1.0"
description = "Nightly ETL that turns a bucket of uploaded photos into a static Photoflow catalog"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "numpy>=2.0",
    "onnxruntime>=1.19",
    "huggingface-hub>=0.25",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "moto[s3]>=5.0",
]

[project.scripts]
worker = "photoflow.__main__:main"
photoflow-import-legacy-db = "photoflow.import_legacy_db:main"
photoflow-copy-media = "photoflow.copy_media:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["photoflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
